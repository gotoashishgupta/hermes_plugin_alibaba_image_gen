[project]
name = "hermes-plugin-image-gen-ext"
version = "0.1.0"
description = "Hermes image_gen provider extensions — unified Alibaba login (Token Plan intl/CN + DashScope PAYG)"
readme = "README.md"
authors = [
    { name = "Ashish Gupta", email = "gotoashishgupta@gmail.com" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.entry-points."hermes_agent.plugins"]
alibaba-imggen = "hermes_plugin_image_gen_ext"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
